<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora do Professor | Salário Líquido, Aulas Extras e Deslocamento</title>
  <meta name="description" content="Simulador financeiro completo para professores da rede pública (PSS/QPM) e privada (CLT). Calcule remuneração líquida, deduções de INSS, RPPS, IRPF marginal e viabilidade de aulas em múltiplos colégios.">
  <link rel="canonical" href="https://calculadoradoprofessor.com.br/">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Estilos customizados -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Espaço reservado para Script do Google AdSense (descomente e insira seu ID após aprovação) -->
  <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script> -->
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- Cabeçalho -->
  <header class="bg-slate-900 text-white border-b border-slate-800 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-5 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <a href="index.html" class="text-2xl font-black tracking-tight text-white hover:text-slate-200 transition">Calculadora do Professor</a>
        <p class="text-xs sm:text-sm text-slate-400">Simulador de remuneração horista, deduções e logística de turmas</p>
      </div>
      <div class="flex items-center gap-3">
        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-950 text-emerald-400 border border-emerald-800">
          ● Tabela Atualizada 2026
        </span>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- Formulário Interativo de Parâmetros (7 Colunas) -->
    <section class="lg:col-span-7 space-y-6">
      <form id="form-calculadora" class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200 space-y-6" onsubmit="event.preventDefault();">
        
        <!-- Seleção de Vínculo Contratual -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">1. Vínculo / Regime Jurídico</label>
          <div class="grid grid-cols-3 gap-2 sm:gap-3">
            <label class="flex items-center justify-center p-3 border rounded-xl cursor-pointer hover:bg-slate-50 text-xs sm:text-sm font-semibold text-slate-700 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50 has-[:checked]:text-indigo-900 transition card-transicao text-center">
              <input type="radio" name="regime" value="pss" checked class="hidden"> PSS / Temporário
            </label>
            <label class="flex items-center justify-center p-3 border rounded-xl cursor-pointer hover:bg-slate-50 text-xs sm:text-sm font-semibold text-slate-700 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50 has-[:checked]:text-indigo-900 transition card-transicao text-center">
              <input type="radio" name="regime" value="qpm" class="hidden"> Efetivo / QPM
            </label>
            <label class="flex items-center justify-center p-3 border rounded-xl cursor-pointer hover:bg-slate-50 text-xs sm:text-sm font-semibold text-slate-700 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50 has-[:checked]:text-indigo-900 transition card-transicao text-center">
              <input type="radio" name="regime" value="clt" class="hidden">

              <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 mt-12">
                <div class="max-w-5xl mx-auto px-4 space-x-4">
                  <a href="index.html" class="hover:underline font-semibold text-slate-700">Início</a>
                  <a href="politica-privacidade.html" class="hover:underline">Política de Privacidade</a>
                  <a href="termos-de-uso.html" class="hover:underline">Termos de Uso</a>
                  <a href="sobre.html" class="hover:underline">Sobre e Contato</a>
                </div>
              </footer>
