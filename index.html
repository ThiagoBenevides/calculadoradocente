<!-- 1. Configurações Gerais e Hora-Atividade -->
<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 space-y-5">
    <div>
      <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">1. Regime de Trabalho Principal</label>
      <div class="grid grid-cols-3 gap-3">
        <label class="flex flex-col items-center justify-center p-3 border-2 rounded-xl cursor-pointer hover:bg-slate-50 text-xs sm:text-sm font-bold text-slate-700 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 has-[:checked]:text-indigo-900 transition-all text-center">
          <input type="radio" name="regime" value="pss" checked class="hidden">
          <span>PSS / Temporário</span>
          <span class="text-[10px] font-normal text-slate-400 mt-0.5">INSS Geral</span>
        </label>

        <label class="flex flex-col items-center justify-center p-3 border-2 rounded-xl cursor-pointer hover:bg-slate-50 text-xs sm:text-sm font-bold text-slate-700 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 has-[:checked]:text-indigo-900 transition-all text-center">
          <input type="radio" name="regime" value="qpm" class="hidden">
          <span>Efetivo / QPM</span>
          <span class="text-[10px] font-normal text-slate-400 mt-0.5">RPPS Próprio</span>
        </label>

        <label class="flex flex-col items-center justify-center p-3 border-2 rounded-xl cursor-pointer hover:bg-slate-50 text-xs sm:text-sm font-bold text-slate-700 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 has-[:checked]:text-indigo-900 transition-all text-center">
          <input type="radio" name="regime" value="clt" class="hidden">
          <span>Particular (CLT)</span>
          <span class="text-[10px] font-normal text-slate-400 mt-0.5">DSR 1/6 + Conv.</span>
        </label>
      </div>
    </div>

    <!-- Módulo de Hora-Atividade -->
    <div class="pt-3 border-t border-slate-100 space-y-3">
      <div class="flex items-center justify-between">
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700">Percentual de Hora-Atividade / Planejamento</label>
        <span id="badge-total-ha" class="text-xs font-bold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded-md border border-indigo-100">+ 0h de atividade</span>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <label class="flex items-center justify-center p-2.5 border rounded-xl cursor-pointer hover:bg-slate-50 text-xs font-semibold text-slate-700 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50 has-[:checked]:text-indigo-900 transition text-center">
          <input type="radio" name="preset-ha" value="0.3333" checked class="hidden">
          <span>33,3% (1/3 Lei)</span>
        </label>
        <label class="flex items-center justify-center p-2.5 border rounded-xl cursor-pointer hover:bg-slate-50 text-xs font-semibold text-slate-700 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50 has-[:checked]:text-indigo-900 transition text-center">
          <input type="radio" name="preset-ha" value="0.20" class="hidden">
          <span>20% (Estadual)</span>
        </label>
        <label class="flex items-center justify-center p-2.5 border rounded-xl cursor-pointer hover:bg-slate-50 text-xs font-semibold text-slate-700 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50 has-[:checked]:text-indigo-900 transition text-center">
          <input type="radio" name="preset-ha" value="0.05" class="hidden">
          <span>5% (Piso CLT)</span>
        </label>
        <label class="flex items-center justify-center p-2.5 border rounded-xl cursor-pointer hover:bg-slate-50 text-xs font-semibold text-slate-700 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50 has-[:checked]:text-indigo-900 transition text-center">
          <input type="radio" name="preset-ha" value="custom" class="hidden">
          <span>Outro %</span>
        </label>
      </div>

      <!-- Input numérico do percentual (caso escolha personalizado ou queira afinar) -->
      <div id="container-pct-custom" class="flex items-center gap-3 pt-1">
        <div class="w-1/2">
          <label for="input-pct-ha" class="block text-[11px] font-semibold text-slate-600 mb-1">Percentual aplicado (%)</label>
          <div class="relative">
            <input type="number" id="input-pct-ha" value="33.33" step="0.5" min="0" max="100" class="w-full rounded-xl border-slate-300 border px-3 py-2 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 focus:outline-none pr-8">
            <span class="absolute right-3 top-2.5 text-xs text-slate-400 font-bold">%</span>
          </div>
        </div>
        <div class="w-1/2 text-xs text-slate-500 pt-3">
          <span class="block">Horas remuneradas totais:</span>
          <strong id="res-jornada-total" class="text-slate-800 text-sm">0h semanais</strong>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-3 border-t border-slate-100">
      <div>
        <label for="input-valor-hora" class="block text-xs font-semibold text-slate-700 mb-1">Valor da Hora-Aula Padrão (R$)</label>
        <input type="number" id="input-valor-hora" value="25.00" step="0.50" min="1" class="w-full rounded-xl border-slate-300 border px-3 py-2 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
      <div>
        <label for="input-gratificacoes" class="block text-xs font-semibold text-slate-700 mb-1">Gratificações Mensais Fixas (R$)</label>
        <input type="number" id="input-gratificacoes" value="0" step="50" min="0" class="w-full rounded-xl border-slate-300 border px-3 py-2 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4 pt-2 border-t border-slate-100">
      <div>
        <label for="input-consumo" class="block text-xs font-semibold text-slate-700 mb-1">Consumo Veículo (Km/L)</label>
        <input type="number" id="input-consumo" value="10" step="0.5" min="1" class="w-full rounded-xl border-slate-300 border px-3 py-2 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
      <div>
        <label for="input-gasolina" class="block text-xs
